# Portrait photos for a hand-picked set of authors, keyed by ORCID iD.
#
# Everyone else keeps their initials. A photo shows wherever the theme draws an
# author's initials disc: the author profile (/authors/{orcid}/), its frequent
# collaborators, research group team lists (/labs/{id}/) and the curator pages.
#
# Add a photo:
#   1. Put a portrait (JPG/PNG/WebP, at least 224×224, roughly square, face centred)
#      in assets/images/authors/ (a folder per lab is fine). Not static/: everything
#      there is published as is, full size.
#   2. Add an entry below. Only add photos we have permission to use.
#
# Fields:
#   image   (required) path under assets/
#   credit  (optional) shown as the photo's tooltip, e.g. "Photo: Lisbon University"
#   anchor  (optional) where to crop when the photo isn't square: Center (default),
#           Top, TopLeft, TopRight, Left, Right, Bottom, BottomLeft, BottomRight, Smart
#
# Example:
# "0000-0002-1825-0097":
#   image: images/authors/0000-0002-1825-0097.jpg
#   credit: "Photo: Example Institute"
#   anchor: Top

