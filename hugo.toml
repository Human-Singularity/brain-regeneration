baseURL = 'https://brain-regeneration.com/'
locale = 'en-uk'
title = 'Brain Regeneration Observatory'
theme = 'brain-regeneration'
copyright = 'Brain Regeneration Observatory 2026'
enableRobotsTXT = true
enableGitInfo = true
rssLimit = 30
timeout = '20s'
summaryLength = 10
defaultContentLanguage = 'en'
timeZone = "Europe/Lisbon"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = false
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    style = "monokai"
    tabWidth = 4
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[params]
# API base URL — override with HUGO_PARAMS_APIBASE env var for local dev
# e.g. HUGO_PARAMS_APIBASE=http://localhost:8000 make dev-local
apiBase = "https://api.brain-regeneration.com"

# GregoryAI "site" identifier for this frontend (distinct from team_id/subject_id
# used elsewhere). Backs the per-site article sitemap the API generates at
# {apiBase}/sitemap/sites/{apiSitemapSiteId}/index.xml — this covers article
# detail pages, which are client-rendered and absent from Hugo's own sitemap.xml.
apiSitemapSiteId = 3

# Site configuration
author = "Brain Regeneration Observatory Team"
defaultAuthor = "authors/default-author"
subtitle = "Accelerating research into brain regeneration and myelin repair"
summary = "A comprehensive knowledge hub tracking therapeutic approaches for reversing damage caused by MS, Alzheimer's, Parkinson's, and other neuro-degenerative diseases."
description = "The Brain Regeneration Observatory tracks research and clinical trials for MS, Alzheimer's, Parkinson's, and other neuro-degenerative diseases."
og_image = "images/getty-images-G1FpRJcLoCw-unsplash.jpg"
[outputs]
	home = [ "HTML", "RSS" ]
	section = [ "HTML", "RSS"]
	term = [ "HTML", "RSS"]

[outputFormats.Search]
baseName = "index"
mediaType = "application/json"
path = "search"

[permalinks]
	post = "/research/:slug/"
	news = "/news/:title/"
	
[sitemap]
	changefreq = "weekly"
	priority = 0.5
	filename = "sitemap.xml"

[taxonomies]
	tag = "tags"
	category = "categories"
	author = "authors"

[params.subscriptions]
	thank_you_url = "/thank-you/"
	error_url = "/error/"

[[params.subscriptions.global_lists]]
	title = "Project News"
	description = "Updates on new developments from the Brain-Regeneration.com project."
	list_id = 10
	team_id = 1

DefaultContentLanguage = "en"

[security]
  # Allow HTML content files (content/about.html, contact.html, etc.)
  allowContent = ['text/html', 'text/markdown', 'text/plain']

[Languages.en]
weight = 1
label = "English"
[Languages.en.params]
description = "Accelerating research into brain regeneration and myelin repair through comprehensive tracking of scientific literature and clinical trials."
subtitle = "Real-time tracking of regenerative medicine research"
