{{ define "extra-head" }}
<link rel="stylesheet" href="{{ "css/article-single.css" | relURL }}">
{{ end }}

{{ define "main" }}
{{- $apiBase := .Site.Params.apiBase | default "https://api.brain-regeneration.com" -}}

<div id="article-shell"
	data-api-base="{{ $apiBase }}"
	data-site-title="{{ .Site.Title }}"
	data-site-description="{{ .Site.Params.description | default "Brain Regeneration Observatory" }}">

	{{/* Loading skeleton */}}
	<div id="article-main" class="section section--sand" style="padding-top: 40px; padding-bottom: 64px;">
		<div class="container">
			<div id="article-loading" class="article-loading-skeleton">
				<div class="skeleton skeleton--eyebrow"></div>
				<div class="skeleton skeleton--title"></div>
				<div class="skeleton skeleton--title skeleton--title-short"></div>
				<div class="skeleton skeleton--authors"></div>
				<div class="skeleton skeleton--meta"></div>
			</div>
			<div id="article-error" class="article-error-state" hidden>
				<p>We could not load this article.</p>
				<button class="btn-outline-teal" id="article-retry-btn">Try again</button>
			</div>
			<div id="article-content" hidden></div>
		</div>
	</div>

</div>

{{ end }}

{{ define "page-scripts" }}
<script>
	window.__API_BASE__ = {{ .Site.Params.apiBase | default "https://api.brain-regeneration.com" | jsonify }};
	// Subject id → landing page + papers/trials tables + curated categories (partials/subject-links.html).
	window.__SUBJECT_LINKS__ = {{ partial "subject-links" . | jsonify | safeJS }};
</script>
<script src="{{ "js/article-single.js" | relURL }}"></script>
{{ end }}
